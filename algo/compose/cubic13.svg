<svg width="2200" height="1160" viewBox="-4 -14.5 45 22" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="cubeBase">
      <circle cx="0.5" cy="2.5" r="0.05" fill="#ff5555"/>
      <text x="-0.20" y="2.6" font-weight="500">0 0 0</text>
      <circle cx="2.5" cy="2.5" r="0.05" fill="#ff5555"/>
      <text x="2.68" y="2.6" font-weight="100">1 0 0</text>
      <circle cx="1.7" cy="1.7" r="0.05" fill="#ff5555"/>
      <text x="1.90" y="1.65" font-weight="100">1 1 0</text>
      <circle cx="-0.3" cy="1.7" r="0.05" fill="#ff5555"/>
      <text x="-0.95" y="1.8" font-weight="100">0 1 0</text>
      <circle cx="0.5" cy="0.5" r="0.05" fill="#4488ff"/>
      <text x="0.68" y="0.35" font-weight="100">0 0 1</text>
      <circle cx="2.5" cy="0.5" r="0.05" fill="#4488ff"/>
      <text x="2.68" y="0.55" font-weight="100">1 0 1</text>
      <circle cx="1.7" cy="-0.3" r="0.05" fill="#4488ff"/>
      <text x="1.85" y="-0.35" font-weight="500">1 1 1</text>
      <circle cx="-0.3" cy="-0.3" r="0.05" fill="#4488ff"/>
      <text x="-0.90" y="-0.35" font-weight="100">0 1 1</text>
      <path d="M 0.5 2.5 L 2.5 2.5 L 1.7 1.7 L -0.3 1.7 Z"/>
      <path d="M 0.5 0.5 L 2.5 0.5 L 1.7 -0.3 L -0.3 -0.3 Z"/>
      <path d="M 0.5 2.5 L 0.5 0.5"/>
      <path d="M 2.5 2.5 L 2.5 0.5"/>
      <path d="M 1.7 1.7 L 1.7 -0.3"/>
      <path d="M -0.3 1.7 L -0.3 -0.3"/>
    </g>
  </defs>
  <g stroke="#333" stroke-width="0.03" fill="none" font-size="0.18" font-family="sans-serif">
    <g transform="translate(0, 3) scale(1.5)">
      <!-- ========== 第1列｜先X轴，后YZ平面3种 ========== -->
      <!-- 行1 x→y→z -->
      <g transform="translate(0,0)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 2.5 2.5 L 1.7 1.7 L 1.7 -0.3" stroke="rgba(255,34,34,0.8)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行2 x→z→y -->
      <g transform="translate(0,-5.2)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 2.5 2.5 L 2.5 0.5 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行3 x→yz对角 -->
      <g transform="translate(0,-10.4)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 2.5 2.5 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>


      <!-- ========== 第2列｜先Z轴，后XY平面3种 ========== -->
      <!-- 行1 z→x→y -->
      <g transform="translate(5.2,0)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 0.5 0.5 L 2.5 0.5 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行2 z→y→x -->
      <g transform="translate(5.2,-5.2)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 0.5 0.5 L -0.3 -0.3 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行3 z→xy对角 -->
      <g transform="translate(5.2,-10.4)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 0.5 0.5 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>


      <!-- ========== 第3列｜先Y轴，后XZ平面3种 ========== -->
      <!-- 行1 y→x→z -->
      <g transform="translate(10.4,0)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L -0.3 1.7 L 1.7 1.7 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行2 y→z→x -->
      <g transform="translate(10.4,-5.2)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L -0.3 1.7 L -0.3 -0.3 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行3 y→xz对角 -->
      <g transform="translate(10.4,-10.4)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L -0.3 1.7 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>


      <!-- ========== 第4列｜先面对角，再轴线3种 ========== -->
      <!-- 行1 xy对角→z -->
      <g transform="translate(15.6,0)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 1.7 1.7 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行2 yz对角→x -->
      <g transform="translate(15.6,-5.2)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L -0.3 -0.3 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
      <!-- 行3 xz对角→y -->
      <g transform="translate(15.6,-10.4)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 2.5 0.5 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>


      <!-- ========== 第5列｜仅中间行放置三维对角线 ========== -->
      <!-- 行2 三维对角线直达 -->
      <g transform="translate(20.8,-5.2)">
        <use href="#cubeBase"/>
        <path d="M 0.5 2.5 L 1.7 -0.3" stroke="rgba(255,34,34,0.644)" stroke-width="0.08" fill="none"/>
      </g>
    </g>
  </g>
</svg>